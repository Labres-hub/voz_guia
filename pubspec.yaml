name: voz_guia
description: "App de navegação por voz para pessoas com deficiência visual"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Leitura de instruções em voz alta (Text-to-Speech)
  flutter_tts: ^4.0.2

  # Reconhecimento de fala para busca de destino por voz (Speech-to-Text)
  speech_to_text: ^7.0.0

  # Requisições HTTP para a Google Directions API
  http: ^1.2.1

  # Localização GPS do usuário
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
